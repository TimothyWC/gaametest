<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD ZONE // Survival</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a0a;
    font-family: 'Courier New', monospace;
    color: #8fbc8f;
    user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(ellipse at center, #1a1a1a 0%, #050505 100%);
  }
  canvas {
    display: block;
    background: #111;
    cursor: crosshair;
    image-rendering: pixelated;
    box-shadow: 0 0 60px rgba(0,255,0,0.08);
  }
  #hud {
    position: absolute;
    top: 20px; left: 20px;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(143,188,143,0.6);
    font-size: 14px;
    line-height: 1.6;
  }
  #hud .stat { letter-spacing: 2px; text-transform: uppercase; }
  #hud .value { color: #c8e6c9; font-weight: bold; font-size: 16px; }
  .bar {
    width: 200px; height: 8px;
    background: rgba(143,188,143,0.15);
    border: 1px solid rgba(143,188,143,0.4);
    margin-top: 4px; position: relative;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff3333, #ff6666);
    transition: width 0.2s;
  }
  #waveInfo {
    position: absolute;
    top: 20px; right: 20px;
    text-align: right;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(255,60,60,0.6);
  }
  #waveInfo .wave-num {
    font-size: 28px; color: #ff4444; font-weight: bold;
    letter-spacing: 4px;
  }
  #waveInfo .score { color: #c8e6c9; font-size: 16px; margin-top: 8px; }
  #weaponInfo {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    padding: 12px 24px;
    border: 1px solid rgba(143,188,143,0.3);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
  }
  #weaponInfo .weapon-name {
    font-size: 18px; letter-spacing: 3px; color: #ffeb3b;
    text-shadow: 0 0 10px rgba(255,235,59,0.5);
  }
  #weaponInfo .ammo {
    font-size: 14px; color: #8fbc8f; margin-top: 4px;
  }
  #startScreen, #gameOverScreen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  #startScreen h1, #gameOverScreen h1 {
    font-size: 72px;
    color: #ff3333;
    letter-spacing: 12px;
    text-shadow: 0 0 30px rgba(255,51,51,0.6), 4px 4px 0 #000;
    margin-bottom: 20px;
    animation: flicker 3s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.3; }
    94% { opacity: 1; }
    96% { opacity: 0.5; }
    97% { opacity: 1; }
  }
  #startScreen .subtitle, #gameOverScreen .subtitle {
    font-size: 16px; color: #8fbc8f;
    letter-spacing: 4px; margin-bottom: 40px;
  }
  #startScreen .controls, #gameOverScreen .stats-box {
    font-size: 14px; color: #aaa;
    line-height: 2; text-align: center;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }
  #startScreen .controls span, #gameOverScreen .stats-box span {
    color: #ffeb3b; font-weight: bold;
  }
  .btn {
    padding: 14px 40px;
    background: transparent;
    border: 2px solid #ff3333;
    color: #ff3333;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    letter-spacing: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    pointer-events: auto;
  }
  .btn:hover {
    background: #ff3333;
    color: #000;
    box-shadow: 0 0 30px rgba(255,51,51,0.6);
  }
  .hidden { display: none !important; }
  #crosshairMsg {
    position: absolute;
    bottom: 100px; left: 50%;
    transform: translateX(-50%);
    color: #ffeb3b;
    font-size: 12px;
    letter-spacing: 3px;
    text-shadow: 0 0 8px rgba(255,235,59,0.6);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #crosshairMsg.show { opacity: 1; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game"></canvas>

  <div id="hud" class="hidden">
    <div class="stat">HEALTH</div>
    <div class="bar"><div class="bar-fill" id="healthBar" style="width:100%"></div></div>
    <div class="stat" style="margin-top:10px;">KILLS: <span class="value" id="killCount">0</span></div>
  </div>

  <div id="waveInfo" class="hidden">
    <div class="stat">WAVE</div>
    <div class="wave-num" id="waveNum">1</div>
    <div class="score">TIME: <span id="timeAlive">00:00</span></div>
  </div>

  <div id="weaponInfo" class="hidden">
    <div class="weapon-name" id="weaponName">UNARMED</div>
    <div class="ammo" id="ammoCount">FISTS ONLY</div>
  </div>

  <div id="crosshairMsg">PRESS [E] TO PICK UP</div>

  <div id="startScreen">
    <h1>DEAD ZONE</h1>
    <div class="subtitle">// SURVIVAL PROTOCOL //</div>
    <div class="controls">
      <span>WASD</span> or <span>ARROWS</span> — MOVE<br>
      <span>MOUSE</span> — AIM<br>
      <span>CLICK</span> or <span>SPACE</span> — ATTACK<br>
      <span>E</span> — PICK UP WEAPON<br>
    </div>
    <button class="btn" id="startBtn">ENTER ZONE</button>
  </div>

  <div id="gameOverScreen" class="hidden">
    <h1>YOU DIED</h1>
    <div class="subtitle">// OUTBREAK CONTAINED? //</div>
    <div class="stats-box">
      SURVIVED: <span id="finalTime">00:00</span><br>
      WAVE REACHED: <span id="finalWave">1</span><br>
      ZOMBIES KILLED: <span id="finalKills">0</span>
    </div>
    <button class="btn" id="restartBtn">RESPAWN</button>
  </div>
</div>

<script>
// ================================================================
// DEAD ZONE - 2D Zombie Survival
// ================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---- Game Constants ----
const WEAPONS = {
  fists:   { name: 'FISTS',    damage: 8,  fireRate: 350, range: 40,  melee: true,  ammo: Infinity, color: '#888' },
  pistol:  { name: 'PISTOL',   damage: 20, fireRate: 280, bulletSpeed: 11, ammo: 24, color: '#b0bec5', bulletColor: '#ffeb3b' },
  shotgun: { name: 'SHOTGUN',  damage: 14, fireRate: 700, bulletSpeed: 10, ammo: 12, pellets: 6, spread: 0.45, color: '#8d6e63', bulletColor: '#ff9800' },
  smg:     { name: 'SMG',      damage: 10, fireRate: 85,  bulletSpeed: 12, ammo: 60, spread: 0.12, color: '#424242', bulletColor: '#ffc107' },
  rifle:   { name: 'RIFLE',    damage: 35, fireRate: 130, bulletSpeed: 16, ammo: 40, color: '#4e342e', bulletColor: '#ff5722' }
};
const WEAPON_TYPES = ['pistol', 'shotgun', 'smg', 'rifle'];

// ---- Game State ----
let gameState = 'menu'; // menu, playing, gameover
let player, zombies, bullets, pickups, particles, bloodStains;
let keys = {};
let mouse = { x: 0, y: 0, down: false };
let nearbyPickup = null;
let lastShot = 0;
let wave = 1;
let killCount = 0;
let startTime = 0;
let lastZombieSpawn = 0;
let lastPickupSpawn = 0;
let screenShake = 0;
let damageFlash = 0;

// ---- Resize Canvas ----
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---- Input ----
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ') e.preventDefault();
  if (e.key.toLowerCase() === 'e' && nearbyPickup && gameState === 'playing') {
    pickupWeapon(nearbyPickup);
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mousedown', () => mouse.down = true);
canvas.addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---- Game Init ----
function initGame() {
  player = {
    x: canvas.width / 2,
    y: canvas.height / 2,
    radius: 14,
    speed: 3.2,
    health: 100,
    maxHealth: 100,
    angle: 0,
    weapon: 'fists',
    ammo: Infinity,
    flashTime: 0
  };
  zombies = [];
  bullets = [];
  pickups = [];
  particles = [];
  bloodStains = [];
  wave = 1;
  killCount = 0;
  startTime = performance.now();
  lastZombieSpawn = 0;
  lastPickupSpawn = 0;
  screenShake = 0;
  damageFlash = 0;

  // Start with a few pickups scattered
  for (let i = 0; i < 3; i++) spawnPickup();
}

// ---- Spawning ----
function spawnZombie() {
  // Spawn from edge of screen
  const side = Math.floor(Math.random() * 4);
  let x, y;
  const margin = 40;
  if (side === 0) { x = Math.random() * canvas.width; y = -margin; }
  else if (side === 1) { x = canvas.width + margin; y = Math.random() * canvas.height; }
  else if (side === 2) { x = Math.random() * canvas.width; y = canvas.height + margin; }
  else { x = -margin; y = Math.random() * canvas.height; }

  // Difficulty scales with wave
  const tier = Math.random();
  let type = 'normal';
  if (wave >= 3 && tier < 0.15) type = 'fast';
  if (wave >= 5 && tier > 0.92) type = 'tank';

  const configs = {
    normal: { hp: 30, speed: 1.0 + wave * 0.05, damage: 10, radius: 14, color: '#4a6741' },
    fast:   { hp: 18, speed: 2.2 + wave * 0.05, damage: 6,  radius: 11, color: '#6b8e23' },
    tank:   { hp: 90, speed: 0.7,               damage: 20, radius: 20, color: '#2d4a2d' }
  };
  const c = configs[type];

  zombies.push({
    x, y, radius: c.radius, speed: c.speed, hp: c.hp, maxHp: c.hp,
    damage: c.damage, color: c.color, type,
    angle: 0, walkCycle: Math.random() * Math.PI * 2,
    hitFlash: 0, lastAttack: 0
  });
}

function spawnPickup() {
  const type = WEAPON_TYPES[Math.floor(Math.random() * WEAPON_TYPES.length)];
  const margin = 80;
  pickups.push({
    x: margin + Math.random() * (canvas.width - margin * 2),
    y: margin + Math.random() * (canvas.height - margin * 2),
    type,
    bob: Math.random() * Math.PI * 2,
    life: 20000 // disappears after 20s
  });
}

function pickupWeapon(pickup) {
  player.weapon = pickup.type;
  player.ammo = WEAPONS[pickup.type].ammo;
  const idx = pickups.indexOf(pickup);
  if (idx >= 0) pickups.splice(idx, 1);
  nearbyPickup = null;
  // Pickup particles
  for (let i = 0; i < 12; i++) {
    particles.push({
      x: pickup.x, y: pickup.y,
      vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
      life: 30, maxLife: 30, color: '#ffeb3b', size: 3
    });
  }
}

// ---- Attack Logic ----
function tryAttack() {
  const now = performance.now();
  const weapon = WEAPONS[player.weapon];
  if (now - lastShot < weapon.fireRate) return;
  if (player.ammo <= 0) return;
  lastShot = now;

  if (weapon.melee) {
    // Melee swing - hit zombies in arc
    zombies.forEach(z => {
      const dx = z.x - player.x, dy = z.y - player.y;
      const dist = Math.hypot(dx, dy);
      if (dist < weapon.range + z.radius) {
        const angleToZ = Math.atan2(dy, dx);
        let angleDiff = Math.abs(angleToZ - player.angle);
        if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;
        if (angleDiff < Math.PI / 3) {
          damageZombie(z, weapon.damage);
          // knockback
          z.x += Math.cos(player.angle) * 8;
          z.y += Math.sin(player.angle) * 8;
        }
      }
    });
    screenShake = 3;
  } else if (weapon.pellets) {
    // Shotgun
    for (let i = 0; i < weapon.pellets; i++) {
      const spread = (Math.random() - 0.5) * weapon.spread;
      const a = player.angle + spread;
      bullets.push({
        x: player.x + Math.cos(player.angle) * 20,
        y: player.y + Math.sin(player.angle) * 20,
        vx: Math.cos(a) * weapon.bulletSpeed,
        vy: Math.sin(a) * weapon.bulletSpeed,
        damage: weapon.damage,
        life: 40,
        color: weapon.bulletColor,
        size: 3
      });
    }
    player.ammo--;
    screenShake = 8;
  } else {
    const spread = weapon.spread ? (Math.random() - 0.5) * weapon.spread : 0;
    const a = player.angle + spread;
    bullets.push({
      x: player.x + Math.cos(player.angle) * 20,
      y: player.y + Math.sin(player.angle) * 20,
      vx: Math.cos(a) * weapon.bulletSpeed,
      vy: Math.sin(a) * weapon.bulletSpeed,
      damage: weapon.damage,
      life: 60,
      color: weapon.bulletColor,
      size: 3
    });
    player.ammo--;
    screenShake = 2;
  }

  // If out of ammo, drop to fists
  if (player.ammo <= 0 && !weapon.melee) {
    player.weapon = 'fists';
    player.ammo = Infinity;
  }
}

function damageZombie(z, dmg) {
  z.hp -= dmg;
  z.hitFlash = 8;
  // Blood particles
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: z.x, y: z.y,
      vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
      life: 20 + Math.random() * 10, maxLife: 30,
      color: '#aa0000', size: 2 + Math.random() * 2
    });
  }
  if (z.hp <= 0) {
    killZombie(z);
  }
}

function killZombie(z) {
  // Big blood explosion
  for (let i = 0; i < 20; i++) {
    particles.push({
      x: z.x, y: z.y,
      vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
      life: 30 + Math.random() * 20, maxLife: 50,
      color: Math.random() > 0.5 ? '#aa0000' : '#660000',
      size: 2 + Math.random() * 4
    });
  }
  // Permanent blood stain
  bloodStains.push({ x: z.x, y: z.y, radius: 15 + Math.random() * 10, alpha: 0.4 });
  const idx = zombies.indexOf(z);
  if (idx >= 0) zombies.splice(idx, 1);
  killCount++;
}

// ---- Update ----
function update(dt) {
  if (gameState !== 'playing') return;
  const now = performance.now();

  // Movement
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;
  if (dx !== 0 || dy !== 0) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    player.x += dx * player.speed;
    player.y += dy * player.speed;
  }
  player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

  // Aim at mouse
  player.angle = Math.atan2(mouse.y - player.y, mouse.x - player.x);

  // Shoot
  if (mouse.down || keys[' ']) tryAttack();

  if (player.flashTime > 0) player.flashTime--;

  // Wave progression: wave increases every 30s
  const elapsed = (now - startTime) / 1000;
  wave = 1 + Math.floor(elapsed / 30);

  // Zombie spawning - rate increases with wave
  const spawnInterval = Math.max(400, 2000 - wave * 180);
  if (now - lastZombieSpawn > spawnInterval) {
    lastZombieSpawn = now;
    const batch = 1 + Math.floor(wave / 3);
    for (let i = 0; i < batch; i++) spawnZombie();
  }

  // Weapon pickups spawn periodically
  if (now - lastPickupSpawn > 8000 && pickups.length < 5) {
    lastPickupSpawn = now;
    spawnPickup();
  }

  // Update zombies
  zombies.forEach(z => {
    const zdx = player.x - z.x, zdy = player.y - z.y;
    const dist = Math.hypot(zdx, zdy);
    if (dist > 1) {
      z.x += (zdx / dist) * z.speed;
      z.y += (zdy / dist) * z.speed;
    }
    z.angle = Math.atan2(zdy, zdx);
    z.walkCycle += 0.15;
    if (z.hitFlash > 0) z.hitFlash--;

    // Attack player
    if (dist < z.radius + player.radius + 4 && now - z.lastAttack > 700) {
      z.lastAttack = now;
      player.health -= z.damage;
      player.flashTime = 10;
      damageFlash = 20;
      screenShake = Math.max(screenShake, 6);
      // Knockback
      player.x -= (zdx / dist) * 6;
      player.y -= (zdy / dist) * 6;
      if (player.health <= 0) gameOver();
    }
  });

  // Resolve zombie overlap (push apart)
  for (let i = 0; i < zombies.length; i++) {
    for (let j = i + 1; j < zombies.length; j++) {
      const a = zombies[i], b = zombies[j];
      const ddx = b.x - a.x, ddy = b.y - a.y;
      const d = Math.hypot(ddx, ddy);
      const minDist = a.radius + b.radius;
      if (d < minDist && d > 0) {
        const push = (minDist - d) / 2;
        a.x -= (ddx / d) * push;
        a.y -= (ddy / d) * push;
        b.x += (ddx / d) * push;
        b.y += (ddy / d) * push;
      }
    }
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    if (b.life <= 0 || b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
      bullets.splice(i, 1);
      continue;
    }
    // Hit check
    for (let j = 0; j < zombies.length; j++) {
      const z = zombies[j];
      if (Math.hypot(b.x - z.x, b.y - z.y) < z.radius) {
        damageZombie(z, b.damage);
        bullets.splice(i, 1);
        break;
      }
    }
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.bob += 0.08;
    p.life -= dt;
    if (p.life <= 0) pickups.splice(i, 1);
  }

  // Find nearby pickup
  nearbyPickup = null;
  let minDist = Infinity;
  pickups.forEach(p => {
    const d = Math.hypot(p.x - player.x, p.y - player.y);
    if (d < 40 && d < minDist) { minDist = d; nearbyPickup = p; }
  });

  // Decay effects
  if (screenShake > 0) screenShake *= 0.85;
  if (damageFlash > 0) damageFlash--;

  // Update HUD
  updateHUD();
}

// ---- Rendering ----
function draw() {
  ctx.save();

  // Screen shake
  if (screenShake > 0.5) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake,
      (Math.random() - 0.5) * screenShake
    );
  }

  // Background
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Grid pattern
  ctx.strokeStyle = 'rgba(50, 70, 50, 0.15)';
  ctx.lineWidth = 1;
  const gridSize = 50;
  for (let x = 0; x < canvas.width; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
  }
  for (let y = 0; y < canvas.height; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
  }

  // Blood stains (floor)
  bloodStains.forEach(s => {
    ctx.fillStyle = `rgba(80, 0, 0, ${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  // Limit blood stains
  if (bloodStains.length > 150) bloodStains.splice(0, bloodStains.length - 150);

  if (gameState === 'playing') {
    // Weapon pickups
    pickups.forEach(p => {
      const yOff = Math.sin(p.bob) * 3;
      const fading = p.life < 4000 && Math.floor(p.life / 200) % 2 === 0;
      if (fading) return;

      // Glow
      const grad = ctx.createRadialGradient(p.x, p.y + yOff, 0, p.x, p.y + yOff, 30);
      grad.addColorStop(0, 'rgba(255,235,59,0.4)');
      grad.addColorStop(1, 'rgba(255,235,59,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(p.x - 30, p.y + yOff - 30, 60, 60);

      // Weapon icon
      drawWeaponIcon(p.x, p.y + yOff, p.type);
    });

    // Player
    drawPlayer();

    // Zombies
    zombies.forEach(drawZombie);

    // Bullets
    bullets.forEach(b => {
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Particles
    particles.forEach(p => {
      const a = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  ctx.restore();

  // Damage vignette
  if (damageFlash > 0) {
    const grad = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, 0,
      canvas.width / 2, canvas.height / 2, canvas.width / 2
    );
    grad.addColorStop(0, 'rgba(255,0,0,0)');
    grad.addColorStop(0.7, 'rgba(255,0,0,0)');
    grad.addColorStop(1, `rgba(255,0,0,${damageFlash / 30})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Vignette overlay
  const vignette = ctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, canvas.width * 0.3,
    canvas.width / 2, canvas.height / 2, canvas.width * 0.75
  );
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 4, player.radius, player.radius * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(player.angle);

  // Body
  ctx.fillStyle = player.flashTime > 0 ? '#fff' : '#3c8dbc';
  ctx.strokeStyle = '#1a4a6a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Weapon in hand
  const w = WEAPONS[player.weapon];
  ctx.fillStyle = w.color;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  if (w.melee) {
    // fists - just small bumps
    ctx.beginPath();
    ctx.arc(player.radius - 2, -6, 4, 0, Math.PI * 2);
    ctx.arc(player.radius - 2, 6, 4, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  } else {
    // Gun shape
    ctx.fillRect(player.radius - 4, -3, 18, 6);
    ctx.strokeRect(player.radius - 4, -3, 18, 6);
    if (player.weapon === 'shotgun' || player.weapon === 'rifle') {
      ctx.fillRect(player.radius + 8, -4, 8, 8);
      ctx.strokeRect(player.radius + 8, -4, 8, 8);
    }
  }

  ctx.restore();

  // Aim indicator
  ctx.save();
  ctx.strokeStyle = 'rgba(255,235,59,0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(player.x + Math.cos(player.angle) * 25, player.y + Math.sin(player.angle) * 25);
  ctx.lineTo(player.x + Math.cos(player.angle) * 200, player.y + Math.sin(player.angle) * 200);
  ctx.stroke();
  ctx.restore();
}

function drawZombie(z) {
  ctx.save();
  ctx.translate(z.x, z.y);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 4, z.radius, z.radius * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(z.angle);

  // Walk wobble
  const wobble = Math.sin(z.walkCycle) * 1.5;
  ctx.translate(0, wobble);

  // Body
  ctx.fillStyle = z.hitFlash > 0 ? '#fff' : z.color;
  ctx.strokeStyle = '#1a2a1a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, z.radius, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // Eyes (red glowing)
  ctx.fillStyle = '#ff3333';
  ctx.shadowColor = '#ff3333';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(z.radius * 0.4, -z.radius * 0.3, 2, 0, Math.PI * 2);
  ctx.arc(z.radius * 0.4, z.radius * 0.3, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Arms reaching (slight animation)
  const armReach = 4 + Math.sin(z.walkCycle * 0.7) * 2;
  ctx.strokeStyle = z.color;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(z.radius * 0.6, -z.radius * 0.7);
  ctx.lineTo(z.radius + armReach, -z.radius * 0.5);
  ctx.moveTo(z.radius * 0.6, z.radius * 0.7);
  ctx.lineTo(z.radius + armReach, z.radius * 0.5);
  ctx.stroke();

  ctx.restore();

  // Health bar
  if (z.hp < z.maxHp) {
    const barW = z.radius * 2.2;
    const barH = 3;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(z.x - barW / 2, z.y - z.radius - 8, barW, barH);
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(z.x - barW / 2, z.y - z.radius - 8, barW * (z.hp / z.maxHp), barH);
  }
}

function drawWeaponIcon(x, y, type) {
  const w = WEAPONS[type];
  ctx.save();
  ctx.translate(x, y);

  // Base square
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.strokeStyle = '#ffeb3b';
  ctx.lineWidth = 2;
  ctx.fillRect(-14, -14, 28, 28);
  ctx.strokeRect(-14, -14, 28, 28);

  // Weapon shape
  ctx.fillStyle = w.color;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  if (type === 'pistol') {
    ctx.fillRect(-8, -2, 14, 5);
    ctx.fillRect(-4, 2, 5, 6);
    ctx.strokeRect(-8, -2, 14, 5);
    ctx.strokeRect(-4, 2, 5, 6);
  } else if (type === 'shotgun') {
    ctx.fillRect(-10, -2, 20, 4);
    ctx.fillRect(-4, 2, 6, 5);
    ctx.strokeRect(-10, -2, 20, 4);
    ctx.strokeRect(-4, 2, 6, 5);
  } else if (type === 'smg') {
    ctx.fillRect(-8, -2, 14, 4);
    ctx.fillRect(-6, 2, 4, 7);
    ctx.strokeRect(-8, -2, 14, 4);
    ctx.strokeRect(-6, 2, 4, 7);
  } else if (type === 'rifle') {
    ctx.fillRect(-10, -2, 22, 4);
    ctx.fillRect(-2, 2, 4, 5);
    ctx.strokeRect(-10, -2, 22, 4);
    ctx.strokeRect(-2, 2, 4, 5);
  }

  // Label
  ctx.fillStyle = '#ffeb3b';
  ctx.font = 'bold 8px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(w.name, 0, 24);

  ctx.restore();
}

// ---- HUD ----
function updateHUD() {
  document.getElementById('healthBar').style.width =
    Math.max(0, (player.health / player.maxHealth) * 100) + '%';
  document.getElementById('killCount').textContent = killCount;
  document.getElementById('waveNum').textContent = wave;

  const elapsed = (performance.now() - startTime) / 1000;
  const mm = Math.floor(elapsed / 60).toString().padStart(2, '0');
  const ss = Math.floor(elapsed % 60).toString().padStart(2, '0');
  document.getElementById('timeAlive').textContent = `${mm}:${ss}`;

  const w = WEAPONS[player.weapon];
  document.getElementById('weaponName').textContent = w.name;
  document.getElementById('ammoCount').textContent =
    player.ammo === Infinity ? 'MELEE ONLY' : `AMMO: ${player.ammo}`;

  document.getElementById('crosshairMsg').classList.toggle('show', !!nearbyPickup);
}

// ---- Game State ----
function startGame() {
  initGame();
  gameState = 'playing';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('waveInfo').classList.remove('hidden');
  document.getElementById('weaponInfo').classList.remove('hidden');
}

function gameOver() {
  gameState = 'gameover';
  const elapsed = (performance.now() - startTime) / 1000;
  const mm = Math.floor(elapsed / 60).toString().padStart(2, '0');
  const ss = Math.floor(elapsed % 60).toString().padStart(2, '0');
  document.getElementById('finalTime').textContent = `${mm}:${ss}`;
  document.getElementById('finalWave').textContent = wave;
  document.getElementById('finalKills').textContent = killCount;
  document.getElementById('gameOverScreen').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('waveInfo').classList.add('hidden');
  document.getElementById('weaponInfo').classList.add('hidden');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// ---- Game Loop ----
let lastFrame = performance.now();
function loop(now) {
  const dt = now - lastFrame;
  lastFrame = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
