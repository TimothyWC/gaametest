<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEAD ZONE // Survival</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0a0a0a;
    font-family: 'Courier New', monospace;
    color: #8fbc8f;
    user-select: none;
  }
  #gameContainer {
    position: relative;
    width: 100vw; height: 100vh;
    background: radial-gradient(ellipse at center, #1a1a1a 0%, #050505 100%);
    overflow: hidden;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    display: block;
    background: #111;
    cursor: crosshair;
    image-rendering: pixelated;
  }
  #hud {
    position: absolute;
    top: 20px; left: 20px;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(143,188,143,0.6);
    font-size: 14px;
    line-height: 1.6;
  }
  #hud .stat { letter-spacing: 2px; text-transform: uppercase; }
  #hud .value { color: #c8e6c9; font-weight: bold; font-size: 16px; }
  .bar {
    width: 200px; height: 8px;
    background: rgba(143,188,143,0.15);
    border: 1px solid rgba(143,188,143,0.4);
    margin-top: 4px; position: relative;
  }
  .bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff3333, #ff6666);
    transition: width 0.2s;
  }
  .bar-fill.stamina {
    background: linear-gradient(90deg, #4caf50, #8bc34a);
  }
  .bar-fill.stamina.exhausted {
    background: linear-gradient(90deg, #999, #bbb);
  }
  #waveInfo {
    position: absolute;
    top: 20px; right: 20px;
    text-align: right;
    pointer-events: none;
    text-shadow: 0 0 8px rgba(255,60,60,0.6);
  }
  #waveInfo .wave-num {
    font-size: 28px; color: #ff4444; font-weight: bold;
    letter-spacing: 4px;
  }
  #waveInfo .score { color: #c8e6c9; font-size: 16px; margin-top: 8px; }
  #weaponInfo {
    position: absolute;
    bottom: 20px; left: 50%;
    transform: translateX(-50%);
    text-align: center;
    pointer-events: none;
    padding: 12px 24px;
    border: 1px solid rgba(143,188,143,0.3);
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
  }
  #weaponInfo .weapon-name {
    font-size: 18px; letter-spacing: 3px; color: #ffeb3b;
    text-shadow: 0 0 10px rgba(255,235,59,0.5);
  }
  #weaponInfo .ammo {
    font-size: 14px; color: #8fbc8f; margin-top: 4px;
  }
  #startScreen, #gameOverScreen {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    backdrop-filter: blur(8px);
    z-index: 10;
  }
  #startScreen h1, #gameOverScreen h1 {
    font-size: 72px;
    color: #ff3333;
    letter-spacing: 12px;
    text-shadow: 0 0 30px rgba(255,51,51,0.6), 4px 4px 0 #000;
    margin-bottom: 20px;
    animation: flicker 3s infinite;
  }
  @keyframes flicker {
    0%, 100% { opacity: 1; }
    92% { opacity: 1; }
    93% { opacity: 0.3; }
    94% { opacity: 1; }
    96% { opacity: 0.5; }
    97% { opacity: 1; }
  }
  #startScreen .subtitle, #gameOverScreen .subtitle {
    font-size: 16px; color: #8fbc8f;
    letter-spacing: 4px; margin-bottom: 40px;
  }
  #startScreen .controls, #gameOverScreen .stats-box {
    font-size: 14px; color: #aaa;
    line-height: 2; text-align: center;
    margin-bottom: 30px;
    letter-spacing: 2px;
  }
  #startScreen .controls span, #gameOverScreen .stats-box span {
    color: #ffeb3b; font-weight: bold;
  }
  .btn {
    padding: 14px 40px;
    background: transparent;
    border: 2px solid #ff3333;
    color: #ff3333;
    font-family: 'Courier New', monospace;
    font-size: 18px;
    letter-spacing: 4px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
    pointer-events: auto;
  }
  .btn:hover {
    background: #ff3333;
    color: #000;
    box-shadow: 0 0 30px rgba(255,51,51,0.6);
  }
  .hidden { display: none !important; }
  #crosshairMsg {
    position: absolute;
    bottom: 100px; left: 50%;
    transform: translateX(-50%);
    color: #ffeb3b;
    font-size: 12px;
    letter-spacing: 3px;
    text-shadow: 0 0 8px rgba(255,235,59,0.6);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #crosshairMsg.show { opacity: 1; }
</style>
</head>
<body>
<div id="gameContainer">
  <canvas id="game" tabindex="0"></canvas>

  <div id="hud" class="hidden">
    <div class="stat">HEALTH</div>
    <div class="bar"><div class="bar-fill" id="healthBar" style="width:100%"></div></div>
    <div class="stat" style="margin-top:10px;">STAMINA</div>
    <div class="bar"><div class="bar-fill stamina" id="staminaBar" style="width:100%"></div></div>
    <div class="stat" style="margin-top:10px;">KILLS: <span class="value" id="killCount">0</span></div>
  </div>

  <div id="waveInfo" class="hidden">
    <div class="stat">WAVE</div>
    <div class="wave-num" id="waveNum">1</div>
    <div class="score">TIME: <span id="timeAlive">00:00</span></div>
  </div>

  <div id="weaponInfo" class="hidden">
    <div class="weapon-name" id="weaponName">UNARMED</div>
    <div class="ammo" id="ammoCount">FISTS ONLY</div>
  </div>

  <div id="crosshairMsg">PRESS [E] TO PICK UP</div>

  <div id="startScreen">
    <h1>DEAD ZONE</h1>
    <div class="subtitle">// SURVIVAL PROTOCOL //</div>
    <div class="controls">
      <span>WASD</span> or <span>ARROWS</span> — MOVE<br>
      <span>SHIFT</span> — SPRINT<br>
      <span>MOUSE</span> — AIM<br>
      <span>CLICK</span> or <span>SPACE</span> — ATTACK<br>
      <span>E</span> — PICK UP ITEM<br>
    </div>
    <button class="btn" id="startBtn">ENTER ZONE</button>
  </div>

  <div id="gameOverScreen" class="hidden">
    <h1>YOU DIED</h1>
    <div class="subtitle">// OUTBREAK CONTAINED? //</div>
    <div class="stats-box">
      SURVIVED: <span id="finalTime">00:00</span><br>
      WAVE REACHED: <span id="finalWave">1</span><br>
      ZOMBIES KILLED: <span id="finalKills">0</span>
    </div>
    <button class="btn" id="restartBtn">RESPAWN</button>
  </div>
</div>

<script>
// ================================================================
// DEAD ZONE - 2D Zombie Survival
// ================================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// ---- Game Constants ----
const WORLD = { width: 3200, height: 2400 };
const WEAPONS = {
  fists:   { name: 'FISTS',    damage: 8,  fireRate: 350, range: 40,  melee: true,  ammo: Infinity, color: '#888',    rarity: 0  },
  pistol:  { name: 'PISTOL',   damage: 20, fireRate: 280, bulletSpeed: 11, ammo: 24,  color: '#b0bec5', bulletColor: '#ffeb3b', rarity: 25 },
  shotgun: { name: 'SHOTGUN',  damage: 14, fireRate: 700, bulletSpeed: 10, ammo: 12,  pellets: 6, spread: 0.45, color: '#8d6e63', bulletColor: '#ff9800', rarity: 20 },
  smg:     { name: 'SMG',      damage: 10, fireRate: 85,  bulletSpeed: 12, ammo: 60,  spread: 0.12, color: '#424242', bulletColor: '#ffc107', rarity: 20 },
  rifle:   { name: 'RIFLE',    damage: 35, fireRate: 130, bulletSpeed: 16, ammo: 40,  color: '#4e342e', bulletColor: '#ff5722', rarity: 15 },
  minigun: { name: 'MINIGUN',  damage: 7,  fireRate: 50,  bulletSpeed: 14, ammo: 100, spread: 0.18, color: '#263238', bulletColor: '#ffeb3b', rarity: 12 },
  plasma:  { name: 'PLASMA',   damage: 55, fireRate: 550, bulletSpeed: 7,  ammo: 10,  color: '#00838f', bulletColor: '#00e5ff', rarity: 8, explosive: true, explosionRadius: 95 }
};
// Build weighted list for random weapon drops
function rollWeaponType() {
  const pool = Object.entries(WEAPONS).filter(([, w]) => w.rarity > 0);
  const total = pool.reduce((s, [, w]) => s + w.rarity, 0);
  let r = Math.random() * total;
  for (const [k, w] of pool) { r -= w.rarity; if (r <= 0) return k; }
  return pool[0][0];
}
const MEDKIT_HEAL = 40;

// ---- Game State ----
let gameState = 'menu'; // menu, playing, gameover
let player = null;
let zombies = [];
let bullets = [];
let pickups = [];
let particles = [];
let bloodStains = [];
let explosions = [];
let keys = {};
let camera = { x: 0, y: 0 };
let currentBoss = null;
let wavePhase = 'regular'; // 'regular' | 'boss' | 'interval'
let waveStartTime = 0;
let announcement = null; // { text, subtext, life, maxLife }
let mouse = { x: 0, y: 0, down: false };
let nearbyPickup = null;
let lastShot = 0;
let wave = 1;
let killCount = 0;
let startTime = 0;
let lastZombieSpawn = 0;
let lastPickupSpawn = 0;
let screenShake = 0;
let damageFlash = 0;

// ---- Resize Canvas ----
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// ---- Input ----
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key.toLowerCase() === 'e' && nearbyPickup && gameState === 'playing') {
    usePickup(nearbyPickup);
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mousedown', () => mouse.down = true);
canvas.addEventListener('mouseup', () => mouse.down = false);
canvas.addEventListener('contextmenu', e => e.preventDefault());

// ---- Game Init ----
function initGame() {
  player = {
    x: WORLD.width / 2,
    y: WORLD.height / 2,
    radius: 14,
    speed: 3.2,
    health: 100,
    maxHealth: 100,
    stamina: 100,
    maxStamina: 100,
    staminaExhausted: false,
    angle: 0,
    weapon: 'fists',
    ammo: Infinity,
    flashTime: 0
  };
  zombies = [];
  bullets = [];
  pickups = [];
  particles = [];
  bloodStains = [];
  explosions = [];
  currentBoss = null;
  wavePhase = 'regular';
  waveStartTime = performance.now();
  announcement = { text: 'WAVE 1', subtext: 'SURVIVE', life: 120, maxLife: 120 };
  camera = { x: 0, y: 0 };
  updateCamera();
  wave = 1;
  killCount = 0;
  startTime = performance.now();
  lastZombieSpawn = 0;
  lastPickupSpawn = 0;
  screenShake = 0;
  damageFlash = 0;

  // Start with a few pickups scattered
  // Start with a few pickups scattered near player
  spawnPickupNearPlayer('weapon');
  spawnPickupNearPlayer('weapon');
  spawnPickupNearPlayer('weapon');
}

// ---- Spawning ----
function spawnZombie() {
  // Spawn in ring around player, just outside their view (~700-1000px away)
  const angle = Math.random() * Math.PI * 2;
  const dist = 700 + Math.random() * 300;
  let x = player.x + Math.cos(angle) * dist;
  let y = player.y + Math.sin(angle) * dist;
  // Clamp to world bounds
  x = Math.max(40, Math.min(WORLD.width - 40, x));
  y = Math.max(40, Math.min(WORLD.height - 40, y));

  // Difficulty scales with wave
  const tier = Math.random();
  let type = 'normal';
  if (wave >= 3 && tier < 0.15) type = 'fast';
  if (wave >= 5 && tier > 0.92) type = 'tank';

  const configs = {
    normal: { hp: 30, speed: 1.0 + wave * 0.05, damage: 10, radius: 14, color: '#4a6741' },
    fast:   { hp: 18, speed: 2.2 + wave * 0.05, damage: 6,  radius: 11, color: '#6b8e23' },
    tank:   { hp: 90, speed: 0.7,               damage: 20, radius: 20, color: '#2d4a2d' }
  };
  const c = configs[type];

  zombies.push({
    x, y, radius: c.radius, speed: c.speed, hp: c.hp, maxHp: c.hp,
    damage: c.damage, color: c.color, type,
    angle: 0, walkCycle: Math.random() * Math.PI * 2,
    hitFlash: 0, lastAttack: 0
  });
}

function spawnBoss() {
  const angle = Math.random() * Math.PI * 2;
  const dist = 600;
  let x = player.x + Math.cos(angle) * dist;
  let y = player.y + Math.sin(angle) * dist;
  x = Math.max(60, Math.min(WORLD.width - 60, x));
  y = Math.max(60, Math.min(WORLD.height - 60, y));

  const hp = 200 + wave * 90;
  currentBoss = {
    x, y,
    radius: 38,
    speed: 0.85,
    hp, maxHp: hp,
    damage: 28,
    color: '#5d1a1a',
    type: 'boss',
    isBoss: true,
    angle: 0,
    walkCycle: Math.random() * Math.PI * 2,
    hitFlash: 0,
    lastAttack: 0,
    chargeTimer: 3000 + Math.random() * 2000,
    charging: 0
  };
  zombies.push(currentBoss);
}

function spawnPickup(forceKind) {
  const margin = 80;
  // 12% chance medkit, 88% chance weapon (medkits were too common)
  const kind = forceKind || (Math.random() < 0.12 ? 'medkit' : 'weapon');
  const pickup = {
    kind,
    x: margin + Math.random() * (WORLD.width - margin * 2),
    y: margin + Math.random() * (WORLD.height - margin * 2),
    bob: Math.random() * Math.PI * 2,
    life: 30000 // disappears after 30s (longer to account for bigger world)
  };
  if (kind === 'weapon') {
    pickup.type = rollWeaponType();
  } else {
    pickup.healAmount = MEDKIT_HEAL;
  }
  pickups.push(pickup);
}

// Spawn pickup near the player (within reasonable discovery range)
function spawnPickupNearPlayer(forceKind) {
  const kind = forceKind || (Math.random() < 0.12 ? 'medkit' : 'weapon');
  const angle = Math.random() * Math.PI * 2;
  const dist = 300 + Math.random() * 500;
  const pickup = {
    kind,
    x: Math.max(80, Math.min(WORLD.width - 80, player.x + Math.cos(angle) * dist)),
    y: Math.max(80, Math.min(WORLD.height - 80, player.y + Math.sin(angle) * dist)),
    bob: Math.random() * Math.PI * 2,
    life: 30000
  };
  if (kind === 'weapon') pickup.type = rollWeaponType();
  else pickup.healAmount = MEDKIT_HEAL;
  pickups.push(pickup);
}

function usePickup(pickup) {
  if (pickup.kind === 'weapon') {
    player.weapon = pickup.type;
    player.ammo = WEAPONS[pickup.type].ammo;
  } else if (pickup.kind === 'medkit') {
    player.health = Math.min(player.maxHealth, player.health + pickup.healAmount);
  }
  const idx = pickups.indexOf(pickup);
  if (idx >= 0) pickups.splice(idx, 1);
  nearbyPickup = null;
  // Pickup particles
  const color = pickup.kind === 'medkit' ? '#4caf50' : '#ffeb3b';
  for (let i = 0; i < 14; i++) {
    particles.push({
      x: pickup.x, y: pickup.y,
      vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5,
      life: 30, maxLife: 30, color, size: 3
    });
  }
}

// ---- Attack Logic ----
function tryAttack() {
  const now = performance.now();
  const weapon = WEAPONS[player.weapon];
  if (now - lastShot < weapon.fireRate) return;
  if (player.ammo <= 0) return;
  lastShot = now;

  if (weapon.melee) {
    // Melee swing - hit zombies in arc
    zombies.forEach(z => {
      const dx = z.x - player.x, dy = z.y - player.y;
      const dist = Math.hypot(dx, dy);
      if (dist < weapon.range + z.radius) {
        const angleToZ = Math.atan2(dy, dx);
        let angleDiff = Math.abs(angleToZ - player.angle);
        if (angleDiff > Math.PI) angleDiff = Math.PI * 2 - angleDiff;
        if (angleDiff < Math.PI / 3) {
          damageZombie(z, weapon.damage);
          // knockback
          z.x += Math.cos(player.angle) * 8;
          z.y += Math.sin(player.angle) * 8;
        }
      }
    });
    screenShake = 3;
  } else if (weapon.pellets) {
    // Shotgun
    for (let i = 0; i < weapon.pellets; i++) {
      const spread = (Math.random() - 0.5) * weapon.spread;
      const a = player.angle + spread;
      bullets.push({
        x: player.x + Math.cos(player.angle) * 20,
        y: player.y + Math.sin(player.angle) * 20,
        vx: Math.cos(a) * weapon.bulletSpeed,
        vy: Math.sin(a) * weapon.bulletSpeed,
        damage: weapon.damage,
        life: 40,
        color: weapon.bulletColor,
        size: 3
      });
    }
    player.ammo--;
    screenShake = 8;
  } else {
    const spread = weapon.spread ? (Math.random() - 0.5) * weapon.spread : 0;
    const a = player.angle + spread;
    bullets.push({
      x: player.x + Math.cos(player.angle) * 20,
      y: player.y + Math.sin(player.angle) * 20,
      vx: Math.cos(a) * weapon.bulletSpeed,
      vy: Math.sin(a) * weapon.bulletSpeed,
      damage: weapon.damage,
      life: weapon.explosive ? 90 : 60,
      color: weapon.bulletColor,
      size: weapon.explosive ? 7 : 3,
      explosive: !!weapon.explosive,
      explosionRadius: weapon.explosionRadius || 0,
      trail: !!weapon.explosive
    });
    player.ammo--;
    screenShake = weapon.explosive ? 5 : 2;
  }

  // If out of ammo, drop to fists
  if (player.ammo <= 0 && !weapon.melee) {
    player.weapon = 'fists';
    player.ammo = Infinity;
  }
}

function damageZombie(z, dmg) {
  z.hp -= dmg;
  z.hitFlash = 8;
  // Blood particles
  for (let i = 0; i < 6; i++) {
    particles.push({
      x: z.x, y: z.y,
      vx: (Math.random() - 0.5) * 6, vy: (Math.random() - 0.5) * 6,
      life: 20 + Math.random() * 10, maxLife: 30,
      color: '#aa0000', size: 2 + Math.random() * 2
    });
  }
  if (z.hp <= 0) {
    killZombie(z);
  }
}

function killZombie(z) {
  // Big blood explosion
  for (let i = 0; i < 20; i++) {
    particles.push({
      x: z.x, y: z.y,
      vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
      life: 30 + Math.random() * 20, maxLife: 50,
      color: Math.random() > 0.5 ? '#aa0000' : '#660000',
      size: 2 + Math.random() * 4
    });
  }
  // Permanent blood stain
  bloodStains.push({ x: z.x, y: z.y, radius: 15 + Math.random() * 10, alpha: 0.4 });
  const idx = zombies.indexOf(z);
  if (idx >= 0) zombies.splice(idx, 1);
  killCount++;
}

function triggerExplosion(x, y, radius, damage) {
  // Visual shockwave
  explosions.push({ x, y, radius: 0, maxRadius: radius, life: 25, maxLife: 25 });
  // Damage zombies with falloff (iterate backwards since damageZombie may splice)
  for (let i = zombies.length - 1; i >= 0; i--) {
    const z = zombies[i];
    const d = Math.hypot(z.x - x, z.y - y);
    if (d < radius + z.radius) {
      const falloff = Math.max(0.25, 1 - d / (radius + z.radius));
      damageZombie(z, damage * falloff);
      // knock outward
      if (d > 0) {
        z.x += ((z.x - x) / d) * 10;
        z.y += ((z.y - y) / d) * 10;
      }
    }
  }
  // Explosion particles (cyan/white)
  for (let i = 0; i < 35; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = 2 + Math.random() * 6;
    particles.push({
      x, y,
      vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: 20 + Math.random() * 20, maxLife: 40,
      color: Math.random() > 0.5 ? '#00e5ff' : '#ffffff',
      size: 2 + Math.random() * 3
    });
  }
  screenShake = Math.max(screenShake, 14);
}

function updateCamera() {
  // Center camera on player, clamped to world bounds
  camera.x = player.x - canvas.width / 2;
  camera.y = player.y - canvas.height / 2;
  camera.x = Math.max(0, Math.min(Math.max(0, WORLD.width - canvas.width), camera.x));
  camera.y = Math.max(0, Math.min(Math.max(0, WORLD.height - canvas.height), camera.y));
}

// ---- Update ----
function update(dt) {
  if (gameState !== 'playing') return;
  const now = performance.now();

  // Movement
  let dx = 0, dy = 0;
  if (keys['w'] || keys['arrowup']) dy -= 1;
  if (keys['s'] || keys['arrowdown']) dy += 1;
  if (keys['a'] || keys['arrowleft']) dx -= 1;
  if (keys['d'] || keys['arrowright']) dx += 1;

  // Sprint
  const movingInput = (dx !== 0 || dy !== 0);
  const wantsSprint = keys['shift'] && movingInput && !player.staminaExhausted;
  let currentSpeed = player.speed;
  if (wantsSprint && player.stamina > 0) {
    currentSpeed = player.speed * 1.65;
    player.stamina = Math.max(0, player.stamina - 1.2);
    if (player.stamina === 0) player.staminaExhausted = true;
  } else {
    // Regen when not sprinting (slower regen if just depleted)
    const regen = player.staminaExhausted ? 0.35 : 0.55;
    player.stamina = Math.min(player.maxStamina, player.stamina + regen);
    if (player.stamina >= player.maxStamina * 0.4) player.staminaExhausted = false;
  }

  if (movingInput) {
    const len = Math.hypot(dx, dy);
    dx /= len; dy /= len;
    player.x += dx * currentSpeed;
    player.y += dy * currentSpeed;
  }
  // Clamp to world bounds (not screen bounds — player can explore)
  player.x = Math.max(player.radius, Math.min(WORLD.width - player.radius, player.x));
  player.y = Math.max(player.radius, Math.min(WORLD.height - player.radius, player.y));

  // Camera follows player
  updateCamera();

  // Aim at mouse (convert screen → world coords via camera)
  const worldMouseX = mouse.x + camera.x;
  const worldMouseY = mouse.y + camera.y;
  player.angle = Math.atan2(worldMouseY - player.y, worldMouseX - player.x);

  // Shoot
  if (mouse.down || keys[' ']) tryAttack();

  if (player.flashTime > 0) player.flashTime--;

  // Wave progression with boss phases
  const waveElapsed = (now - waveStartTime) / 1000;

  if (wavePhase === 'regular') {
    // 30 seconds of regular zombie spawns, then boss appears
    if (waveElapsed >= 30) {
      wavePhase = 'boss';
      spawnBoss();
      announcement = { text: 'BOSS INCOMING', subtext: `WAVE ${wave} — ELIMINATE THE BEHEMOTH`, life: 150, maxLife: 150 };
    }
    // Regular zombie spawning - reduced rate (user feedback: too many)
    const spawnInterval = Math.max(800, 3200 - wave * 160);
    if (now - lastZombieSpawn > spawnInterval) {
      lastZombieSpawn = now;
      const batch = 1 + Math.floor(wave / 4);
      for (let i = 0; i < batch; i++) spawnZombie();
    }
  } else if (wavePhase === 'boss') {
    // During boss phase, slower trickle of regular zombies
    const spawnInterval = Math.max(2000, 4500 - wave * 100);
    if (now - lastZombieSpawn > spawnInterval) {
      lastZombieSpawn = now;
      spawnZombie();
    }
    // Check boss death
    if (!currentBoss || currentBoss.hp <= 0) {
      wavePhase = 'interval';
      currentBoss = null;
      announcement = { text: `WAVE ${wave} COMPLETE`, subtext: 'PREPARE FOR NEXT WAVE', life: 150, maxLife: 150 };
      waveStartTime = now; // use this timestamp for interval
    }
  } else if (wavePhase === 'interval') {
    // 4 second breather between waves
    if (waveElapsed >= 4) {
      wave++;
      wavePhase = 'regular';
      waveStartTime = now;
      announcement = { text: `WAVE ${wave}`, subtext: 'SURVIVE', life: 120, maxLife: 120 };
    }
  }

  // Pickup spawning - more frequent, up to more pickups (user feedback: too few guns)
  if (now - lastPickupSpawn > 4500 && pickups.length < 8) {
    lastPickupSpawn = now;
    spawnPickupNearPlayer();
  }

  // Update zombies
  zombies.forEach(z => {
    const zdx = player.x - z.x, zdy = player.y - z.y;
    const dist = Math.hypot(zdx, zdy);

    // Boss charge attack
    if (z.isBoss) {
      if (z.charging > 0) {
        z.charging--;
        // Charge movement (fast lunge toward player)
        const cs = 3.5;
        if (dist > 1) {
          z.x += (zdx / dist) * cs;
          z.y += (zdy / dist) * cs;
        }
      } else {
        z.chargeTimer -= dt;
        if (z.chargeTimer <= 0 && dist < 500 && dist > 80) {
          z.charging = 30; // ~0.5s charge
          z.chargeTimer = 4000 + Math.random() * 2000;
        }
        if (dist > 1) {
          z.x += (zdx / dist) * z.speed;
          z.y += (zdy / dist) * z.speed;
        }
      }
    } else if (dist > 1) {
      z.x += (zdx / dist) * z.speed;
      z.y += (zdy / dist) * z.speed;
    }

    z.angle = Math.atan2(zdy, zdx);
    z.walkCycle += 0.15;
    if (z.hitFlash > 0) z.hitFlash--;

    // Attack player
    const attackCooldown = z.isBoss ? 900 : 700;
    if (dist < z.radius + player.radius + 4 && now - z.lastAttack > attackCooldown) {
      z.lastAttack = now;
      player.health -= z.damage;
      player.flashTime = 10;
      damageFlash = z.isBoss ? 35 : 20;
      screenShake = Math.max(screenShake, z.isBoss ? 12 : 6);
      // Knockback (stronger from boss)
      const kb = z.isBoss ? 14 : 6;
      player.x -= (zdx / dist) * kb;
      player.y -= (zdy / dist) * kb;
      if (player.health <= 0) gameOver();
    }
  });

  // Resolve zombie overlap (push apart)
  for (let i = 0; i < zombies.length; i++) {
    for (let j = i + 1; j < zombies.length; j++) {
      const a = zombies[i], b = zombies[j];
      const ddx = b.x - a.x, ddy = b.y - a.y;
      const d = Math.hypot(ddx, ddy);
      const minDist = a.radius + b.radius;
      if (d < minDist && d > 0) {
        const push = (minDist - d) / 2;
        a.x -= (ddx / d) * push;
        a.y -= (ddy / d) * push;
        b.x += (ddx / d) * push;
        b.y += (ddy / d) * push;
      }
    }
  }

  // Update bullets
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;

    // Trail particles for plasma
    if (b.trail) {
      particles.push({
        x: b.x, y: b.y,
        vx: (Math.random() - 0.5) * 0.8, vy: (Math.random() - 0.5) * 0.8,
        life: 14, maxLife: 14,
        color: '#00e5ff', size: 2 + Math.random() * 2
      });
    }

    const outOfBounds = b.x < 0 || b.x > WORLD.width || b.y < 0 || b.y > WORLD.height;
    if (b.life <= 0 || outOfBounds) {
      if (b.explosive) triggerExplosion(b.x, b.y, b.explosionRadius, b.damage);
      bullets.splice(i, 1);
      continue;
    }
    // Hit check
    let hit = false;
    for (let j = 0; j < zombies.length; j++) {
      const z = zombies[j];
      if (Math.hypot(b.x - z.x, b.y - z.y) < z.radius) {
        if (b.explosive) {
          triggerExplosion(b.x, b.y, b.explosionRadius, b.damage);
        } else {
          damageZombie(z, b.damage);
        }
        bullets.splice(i, 1);
        hit = true;
        break;
      }
    }
    if (hit) continue;
  }

  // Update explosions (shockwave expansion)
  for (let i = explosions.length - 1; i >= 0; i--) {
    const e = explosions[i];
    e.life--;
    e.radius = e.maxRadius * (1 - e.life / e.maxLife);
    if (e.life <= 0) explosions.splice(i, 1);
  }

  // Update particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vx *= 0.92; p.vy *= 0.92;
    p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Update pickups
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    p.bob += 0.08;
    p.life -= dt;
    if (p.life <= 0) pickups.splice(i, 1);
  }

  // Find nearby pickup
  nearbyPickup = null;
  let minDist = Infinity;
  pickups.forEach(p => {
    const d = Math.hypot(p.x - player.x, p.y - player.y);
    if (d < 40 && d < minDist) { minDist = d; nearbyPickup = p; }
  });

  // Decay effects
  if (screenShake > 0) screenShake *= 0.85;
  if (damageFlash > 0) damageFlash--;
  if (announcement) {
    announcement.life--;
    if (announcement.life <= 0) announcement = null;
  }
  // Keep currentBoss synced (killZombie removes from zombies array but doesn't null this)
  if (currentBoss && !zombies.includes(currentBoss)) currentBoss = null;

  // Update HUD
  updateHUD();
}

// ---- Rendering ----
function draw() {
  ctx.save();

  // Screen shake (applied before camera)
  if (screenShake > 0.5) {
    ctx.translate(
      (Math.random() - 0.5) * screenShake,
      (Math.random() - 0.5) * screenShake
    );
  }

  // Background
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Apply camera transform for all world-space rendering
  ctx.save();
  ctx.translate(-camera.x, -camera.y);

  // Grid pattern (draw only visible portion)
  ctx.strokeStyle = 'rgba(50, 70, 50, 0.15)';
  ctx.lineWidth = 1;
  const gridSize = 50;
  const startX = Math.floor(camera.x / gridSize) * gridSize;
  const endX = camera.x + canvas.width + gridSize;
  const startY = Math.floor(camera.y / gridSize) * gridSize;
  const endY = camera.y + canvas.height + gridSize;
  for (let x = startX; x <= endX; x += gridSize) {
    ctx.beginPath(); ctx.moveTo(x, startY); ctx.lineTo(x, endY); ctx.stroke();
  }
  for (let y = startY; y <= endY; y += gridSize) {
    ctx.beginPath(); ctx.moveTo(startX, y); ctx.lineTo(endX, y); ctx.stroke();
  }

  // World boundary walls (visible when near edges)
  ctx.strokeStyle = 'rgba(200, 40, 40, 0.6)';
  ctx.lineWidth = 6;
  ctx.setLineDash([20, 10]);
  ctx.strokeRect(0, 0, WORLD.width, WORLD.height);
  ctx.setLineDash([]);

  // Distance markers on boundary (decorative — hazard stripes)
  ctx.fillStyle = 'rgba(200, 40, 40, 0.1)';
  ctx.fillRect(0, 0, WORLD.width, 8);
  ctx.fillRect(0, WORLD.height - 8, WORLD.width, 8);
  ctx.fillRect(0, 0, 8, WORLD.height);
  ctx.fillRect(WORLD.width - 8, 0, 8, WORLD.height);

  // Blood stains (floor)
  bloodStains.forEach(s => {
    ctx.fillStyle = `rgba(80, 0, 0, ${s.alpha})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
    ctx.fill();
  });

  // Limit blood stains
  if (bloodStains.length > 150) bloodStains.splice(0, bloodStains.length - 150);

  if (gameState === 'playing') {
    // Pickups (weapons and medkits)
    pickups.forEach(p => {
      const yOff = Math.sin(p.bob) * 3;
      const fading = p.life < 4000 && Math.floor(p.life / 200) % 2 === 0;
      if (fading) return;

      const isMedkit = p.kind === 'medkit';
      const glowColor = isMedkit ? '76,175,80' : '255,235,59';

      // Glow
      const grad = ctx.createRadialGradient(p.x, p.y + yOff, 0, p.x, p.y + yOff, 32);
      grad.addColorStop(0, `rgba(${glowColor},0.45)`);
      grad.addColorStop(1, `rgba(${glowColor},0)`);
      ctx.fillStyle = grad;
      ctx.fillRect(p.x - 32, p.y + yOff - 32, 64, 64);

      if (isMedkit) drawMedkitIcon(p.x, p.y + yOff);
      else drawWeaponIcon(p.x, p.y + yOff, p.type);
    });

    // Player
    drawPlayer();

    // Zombies
    zombies.forEach(drawZombie);

    // Bullets
    bullets.forEach(b => {
      ctx.fillStyle = b.color;
      ctx.shadowColor = b.color;
      ctx.shadowBlur = b.explosive ? 20 : 10;
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.size, 0, Math.PI * 2);
      ctx.fill();
      if (b.explosive) {
        // Inner white core for plasma
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(b.x, b.y, b.size * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;
    });

    // Explosion shockwaves
    explosions.forEach(e => {
      const t = e.life / e.maxLife;
      ctx.strokeStyle = `rgba(0,229,255,${t})`;
      ctx.lineWidth = 4 * t + 1;
      ctx.shadowColor = '#00e5ff';
      ctx.shadowBlur = 20;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.stroke();
      // Inner white flash
      const innerGrad = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.radius);
      innerGrad.addColorStop(0, `rgba(255,255,255,${t * 0.6})`);
      innerGrad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = innerGrad;
      ctx.beginPath();
      ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;
    });

    // Particles
    particles.forEach(p => {
      const a = p.life / p.maxLife;
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    });
  }

  // Close camera transform — UI below is in screen space
  ctx.restore();

  // Off-screen pickup/boss arrow indicators
  drawOffscreenIndicators();

  ctx.restore();

  // Damage vignette
  if (damageFlash > 0) {
    const grad = ctx.createRadialGradient(
      canvas.width / 2, canvas.height / 2, 0,
      canvas.width / 2, canvas.height / 2, canvas.width / 2
    );
    grad.addColorStop(0, 'rgba(255,0,0,0)');
    grad.addColorStop(0.7, 'rgba(255,0,0,0)');
    grad.addColorStop(1, `rgba(255,0,0,${damageFlash / 30})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  // Vignette overlay
  const vignette = ctx.createRadialGradient(
    canvas.width / 2, canvas.height / 2, canvas.width * 0.3,
    canvas.width / 2, canvas.height / 2, canvas.width * 0.75
  );
  vignette.addColorStop(0, 'rgba(0,0,0,0)');
  vignette.addColorStop(1, 'rgba(0,0,0,0.7)');
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Boss HP bar (screen space, top-center)
  if (currentBoss && gameState === 'playing') {
    const barW = 500, barH = 18;
    const bx = canvas.width / 2 - barW / 2;
    const by = 90;
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(bx - 4, by - 4, barW + 8, barH + 8);
    ctx.strokeStyle = '#ff3333';
    ctx.lineWidth = 2;
    ctx.strokeRect(bx, by, barW, barH);
    const hpRatio = Math.max(0, currentBoss.hp / currentBoss.maxHp);
    const grad = ctx.createLinearGradient(bx, 0, bx + barW, 0);
    grad.addColorStop(0, '#8b0000');
    grad.addColorStop(1, '#ff3333');
    ctx.fillStyle = grad;
    ctx.fillRect(bx, by, barW * hpRatio, barH);
    ctx.fillStyle = '#ff6666';
    ctx.font = 'bold 12px Courier New';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.fillText(`BEHEMOTH — WAVE ${wave} BOSS`, canvas.width / 2, by - 8);
    ctx.shadowBlur = 0;
  }

  // Wave announcement (big centered text)
  if (announcement && gameState === 'playing') {
    const t = announcement.life / announcement.maxLife;
    const alpha = t > 0.8 ? (1 - t) * 5 : t > 0.2 ? 1 : t * 5;
    ctx.globalAlpha = Math.max(0, Math.min(1, alpha));
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff3333';
    ctx.shadowColor = '#ff0000';
    ctx.shadowBlur = 20;
    ctx.font = 'bold 56px Courier New';
    ctx.fillText(announcement.text, canvas.width / 2, canvas.height / 2 - 40);
    ctx.font = 'bold 18px Courier New';
    ctx.fillStyle = '#ffeb3b';
    ctx.shadowColor = '#ffeb3b';
    ctx.shadowBlur = 10;
    ctx.fillText(announcement.subtext, canvas.width / 2, canvas.height / 2);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

// Draw arrows on screen edges pointing to off-screen pickups and boss
function drawOffscreenIndicators() {
  if (gameState !== 'playing') return;
  const targets = [];
  if (currentBoss) targets.push({ x: currentBoss.x, y: currentBoss.y, color: '#ff3333', label: 'BOSS' });
  pickups.forEach(p => {
    const color = p.kind === 'medkit' ? '#4caf50' : (WEAPONS[p.type]?.rarity <= 12 ? '#e040fb' : '#ffeb3b');
    targets.push({ x: p.x, y: p.y, color, label: '' });
  });

  const padding = 30;
  const viewLeft = camera.x, viewRight = camera.x + canvas.width;
  const viewTop = camera.y, viewBottom = camera.y + canvas.height;

  targets.forEach(t => {
    const onScreen = t.x >= viewLeft && t.x <= viewRight && t.y >= viewTop && t.y <= viewBottom;
    if (onScreen) return;

    // Project target onto screen edge
    const cx = canvas.width / 2, cy = canvas.height / 2;
    const dx = (t.x - camera.x) - cx;
    const dy = (t.y - camera.y) - cy;
    const angle = Math.atan2(dy, dx);

    // Find edge intersection
    const maxX = canvas.width / 2 - padding;
    const maxY = canvas.height / 2 - padding;
    let ex = Math.cos(angle), ey = Math.sin(angle);
    const scale = Math.min(maxX / Math.abs(ex || 0.001), maxY / Math.abs(ey || 0.001));
    const sx = cx + ex * scale;
    const sy = cy + ey * scale;

    // Draw arrow
    ctx.save();
    ctx.translate(sx, sy);
    ctx.rotate(angle);
    ctx.fillStyle = t.color;
    ctx.shadowColor = t.color;
    ctx.shadowBlur = 10;
    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-6, -7);
    ctx.lineTo(-3, 0);
    ctx.lineTo(-6, 7);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.restore();
  });
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 4, player.radius, player.radius * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(player.angle);

  // Body
  ctx.fillStyle = player.flashTime > 0 ? '#fff' : '#3c8dbc';
  ctx.strokeStyle = '#1a4a6a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, player.radius, 0, Math.PI * 2);
  ctx.fill();
  ctx.stroke();

  // Weapon in hand
  const w = WEAPONS[player.weapon];
  ctx.fillStyle = w.color;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  if (w.melee) {
    // fists - just small bumps
    ctx.beginPath();
    ctx.arc(player.radius - 2, -6, 4, 0, Math.PI * 2);
    ctx.arc(player.radius - 2, 6, 4, 0, Math.PI * 2);
    ctx.fill(); ctx.stroke();
  } else {
    // Gun shape
    ctx.fillRect(player.radius - 4, -3, 18, 6);
    ctx.strokeRect(player.radius - 4, -3, 18, 6);
    if (player.weapon === 'shotgun' || player.weapon === 'rifle') {
      ctx.fillRect(player.radius + 8, -4, 8, 8);
      ctx.strokeRect(player.radius + 8, -4, 8, 8);
    }
  }

  ctx.restore();

  // Aim indicator
  ctx.save();
  ctx.strokeStyle = 'rgba(255,235,59,0.3)';
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 6]);
  ctx.beginPath();
  ctx.moveTo(player.x + Math.cos(player.angle) * 25, player.y + Math.sin(player.angle) * 25);
  ctx.lineTo(player.x + Math.cos(player.angle) * 200, player.y + Math.sin(player.angle) * 200);
  ctx.stroke();
  ctx.restore();
}

function drawZombie(z) {
  if (z.isBoss) { drawBoss(z); return; }
  ctx.save();
  ctx.translate(z.x, z.y);

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.beginPath();
  ctx.ellipse(0, 4, z.radius, z.radius * 0.4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.rotate(z.angle);

  // Walk wobble
  const wobble = Math.sin(z.walkCycle) * 1.5;
  ctx.translate(0, wobble);

  // Body
  ctx.fillStyle = z.hitFlash > 0 ? '#fff' : z.color;
  ctx.strokeStyle = '#1a2a1a';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.arc(0, 0, z.radius, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // Eyes (red glowing)
  ctx.fillStyle = '#ff3333';
  ctx.shadowColor = '#ff3333';
  ctx.shadowBlur = 6;
  ctx.beginPath();
  ctx.arc(z.radius * 0.4, -z.radius * 0.3, 2, 0, Math.PI * 2);
  ctx.arc(z.radius * 0.4, z.radius * 0.3, 2, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Arms reaching (slight animation)
  const armReach = 4 + Math.sin(z.walkCycle * 0.7) * 2;
  ctx.strokeStyle = z.color;
  ctx.lineWidth = 4;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(z.radius * 0.6, -z.radius * 0.7);
  ctx.lineTo(z.radius + armReach, -z.radius * 0.5);
  ctx.moveTo(z.radius * 0.6, z.radius * 0.7);
  ctx.lineTo(z.radius + armReach, z.radius * 0.5);
  ctx.stroke();

  ctx.restore();

  // Health bar
  if (z.hp < z.maxHp) {
    const barW = z.radius * 2.2;
    const barH = 3;
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(z.x - barW / 2, z.y - z.radius - 8, barW, barH);
    ctx.fillStyle = '#ff4444';
    ctx.fillRect(z.x - barW / 2, z.y - z.radius - 8, barW * (z.hp / z.maxHp), barH);
  }
}

function drawBoss(z) {
  ctx.save();
  ctx.translate(z.x, z.y);

  // Large shadow
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.beginPath();
  ctx.ellipse(0, 8, z.radius * 1.1, z.radius * 0.45, 0, 0, Math.PI * 2);
  ctx.fill();

  // Charging warning ring (pulsing red before lunge)
  if (z.charging > 0) {
    const t = z.charging / 30;
    ctx.strokeStyle = `rgba(255,0,0,${t})`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, 0, z.radius + 10 + (1 - t) * 14, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.rotate(z.angle);
  const wobble = Math.sin(z.walkCycle * 0.8) * 2;
  ctx.translate(0, wobble);

  // Outer aura (dark glow)
  const aura = ctx.createRadialGradient(0, 0, z.radius, 0, 0, z.radius * 1.8);
  aura.addColorStop(0, 'rgba(139,0,0,0.6)');
  aura.addColorStop(1, 'rgba(139,0,0,0)');
  ctx.fillStyle = aura;
  ctx.beginPath();
  ctx.arc(0, 0, z.radius * 1.8, 0, Math.PI * 2);
  ctx.fill();

  // Main body (darker, meatier)
  ctx.fillStyle = z.hitFlash > 0 ? '#fff' : z.color;
  ctx.strokeStyle = '#1a0505';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.arc(0, 0, z.radius, 0, Math.PI * 2);
  ctx.fill(); ctx.stroke();

  // Torn flesh / battle damage (uneven surface)
  ctx.fillStyle = '#3a1010';
  ctx.beginPath();
  ctx.arc(-z.radius * 0.4, -z.radius * 0.5, 4, 0, Math.PI * 2);
  ctx.arc(-z.radius * 0.2, z.radius * 0.5, 5, 0, Math.PI * 2);
  ctx.arc(z.radius * 0.3, -z.radius * 0.6, 3, 0, Math.PI * 2);
  ctx.fill();

  // Spikes/horns around the back of the head
  ctx.fillStyle = '#2d0a0a';
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const a = Math.PI - 0.8 + (i / 4) * 1.6;
    const spikeX = Math.cos(a) * z.radius;
    const spikeY = Math.sin(a) * z.radius;
    const tipX = Math.cos(a) * (z.radius + 10);
    const tipY = Math.sin(a) * (z.radius + 10);
    ctx.beginPath();
    ctx.moveTo(spikeX + Math.cos(a + Math.PI / 2) * 3, spikeY + Math.sin(a + Math.PI / 2) * 3);
    ctx.lineTo(tipX, tipY);
    ctx.lineTo(spikeX - Math.cos(a + Math.PI / 2) * 3, spikeY - Math.sin(a + Math.PI / 2) * 3);
    ctx.closePath();
    ctx.fill(); ctx.stroke();
  }

  // Big glowing eyes (4 of them for extra menace)
  ctx.fillStyle = '#ff0000';
  ctx.shadowColor = '#ff0000';
  ctx.shadowBlur = 14;
  ctx.beginPath();
  ctx.arc(z.radius * 0.5, -z.radius * 0.35, 3.5, 0, Math.PI * 2);
  ctx.arc(z.radius * 0.5, z.radius * 0.35, 3.5, 0, Math.PI * 2);
  ctx.arc(z.radius * 0.2, -z.radius * 0.55, 2.5, 0, Math.PI * 2);
  ctx.arc(z.radius * 0.2, z.radius * 0.55, 2.5, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // Gaping maw (teeth)
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(z.radius * 0.6, 0, 6, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const tx = z.radius * 0.6 - 4 + i * 2.6;
    ctx.beginPath();
    ctx.moveTo(tx, -3);
    ctx.lineTo(tx, 3);
    ctx.stroke();
  }

  // Massive arms reaching forward
  const armReach = 8 + Math.sin(z.walkCycle * 0.7) * 4;
  ctx.strokeStyle = z.color;
  ctx.lineWidth = 10;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(z.radius * 0.5, -z.radius * 0.8);
  ctx.lineTo(z.radius + armReach, -z.radius * 0.6);
  ctx.moveTo(z.radius * 0.5, z.radius * 0.8);
  ctx.lineTo(z.radius + armReach, z.radius * 0.6);
  ctx.stroke();
  // Claws at end of arms
  ctx.strokeStyle = '#1a0505';
  ctx.lineWidth = 2;
  [-0.6, 0.6].forEach(sign => {
    const baseX = z.radius + armReach;
    const baseY = z.radius * sign;
    for (let i = -1; i <= 1; i++) {
      ctx.beginPath();
      ctx.moveTo(baseX, baseY);
      ctx.lineTo(baseX + 6, baseY + i * 4);
      ctx.stroke();
    }
  });

  ctx.restore();

  // Small world-space name tag above boss (in addition to the big top-center bar)
  ctx.save();
  ctx.fillStyle = '#ff3333';
  ctx.font = 'bold 10px Courier New';
  ctx.textAlign = 'center';
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 4;
  ctx.fillText('▼ BEHEMOTH ▼', z.x, z.y - z.radius - 14);
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawWeaponIcon(x, y, type) {
  const w = WEAPONS[type];
  ctx.save();
  ctx.translate(x, y);

  // Rarity-based outline color (rarity <= 12 means minigun/plasma — rare tier)
  const isRare = w.rarity > 0 && w.rarity <= 12;
  const outlineColor = isRare ? '#e040fb' : '#ffeb3b';

  // Base square
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.strokeStyle = outlineColor;
  ctx.lineWidth = isRare ? 2.5 : 2;
  ctx.fillRect(-14, -14, 28, 28);
  ctx.strokeRect(-14, -14, 28, 28);

  // Weapon shape
  ctx.fillStyle = w.color;
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 1;
  if (type === 'pistol') {
    ctx.fillRect(-8, -2, 14, 5);
    ctx.fillRect(-4, 2, 5, 6);
    ctx.strokeRect(-8, -2, 14, 5);
    ctx.strokeRect(-4, 2, 5, 6);
  } else if (type === 'shotgun') {
    ctx.fillRect(-10, -2, 20, 4);
    ctx.fillRect(-4, 2, 6, 5);
    ctx.strokeRect(-10, -2, 20, 4);
    ctx.strokeRect(-4, 2, 6, 5);
  } else if (type === 'smg') {
    ctx.fillRect(-8, -2, 14, 4);
    ctx.fillRect(-6, 2, 4, 7);
    ctx.strokeRect(-8, -2, 14, 4);
    ctx.strokeRect(-6, 2, 4, 7);
  } else if (type === 'rifle') {
    ctx.fillRect(-10, -2, 22, 4);
    ctx.fillRect(-2, 2, 4, 5);
    ctx.strokeRect(-10, -2, 22, 4);
    ctx.strokeRect(-2, 2, 4, 5);
  } else if (type === 'minigun') {
    // Multi-barrel chunky look
    ctx.fillRect(-10, -4, 20, 3);
    ctx.fillRect(-10, -1, 20, 3);
    ctx.fillRect(-10, 2, 20, 3);
    ctx.strokeRect(-10, -4, 20, 3);
    ctx.strokeRect(-10, -1, 20, 3);
    ctx.strokeRect(-10, 2, 20, 3);
    ctx.fillRect(-6, 5, 6, 4);
    ctx.strokeRect(-6, 5, 6, 4);
  } else if (type === 'plasma') {
    // Sci-fi look with glowing core
    ctx.fillRect(-10, -3, 18, 6);
    ctx.strokeRect(-10, -3, 18, 6);
    ctx.fillStyle = '#00e5ff';
    ctx.shadowColor = '#00e5ff';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(6, 0, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = w.color;
    ctx.fillRect(-4, 3, 5, 5);
    ctx.strokeRect(-4, 3, 5, 5);
  }

  // Label
  ctx.fillStyle = outlineColor;
  ctx.font = 'bold 8px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText(w.name, 0, 24);

  // Rare marker
  if (isRare) {
    ctx.fillStyle = '#e040fb';
    ctx.font = 'bold 7px Courier New';
    ctx.fillText('★ RARE', 0, -18);
  }

  ctx.restore();
}

function drawMedkitIcon(x, y) {
  ctx.save();
  ctx.translate(x, y);
  // White box with red cross
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.strokeStyle = '#4caf50';
  ctx.lineWidth = 2;
  ctx.fillRect(-14, -14, 28, 28);
  ctx.strokeRect(-14, -14, 28, 28);
  // White inner square
  ctx.fillStyle = '#f5f5f5';
  ctx.fillRect(-9, -9, 18, 18);
  ctx.strokeStyle = '#000';
  ctx.strokeRect(-9, -9, 18, 18);
  // Red cross
  ctx.fillStyle = '#d32f2f';
  ctx.fillRect(-2, -7, 4, 14);
  ctx.fillRect(-7, -2, 14, 4);
  // Label
  ctx.fillStyle = '#4caf50';
  ctx.font = 'bold 8px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('+HEAL', 0, 24);
  ctx.restore();
}

// ---- HUD ----
function updateHUD() {
  document.getElementById('healthBar').style.width =
    Math.max(0, (player.health / player.maxHealth) * 100) + '%';
  const staminaBar = document.getElementById('staminaBar');
  staminaBar.style.width = Math.max(0, (player.stamina / player.maxStamina) * 100) + '%';
  staminaBar.classList.toggle('exhausted', player.staminaExhausted);
  document.getElementById('killCount').textContent = killCount;
  document.getElementById('waveNum').textContent = wave;

  const elapsed = (performance.now() - startTime) / 1000;
  const mm = Math.floor(elapsed / 60).toString().padStart(2, '0');
  const ss = Math.floor(elapsed % 60).toString().padStart(2, '0');
  document.getElementById('timeAlive').textContent = `${mm}:${ss}`;

  const w = WEAPONS[player.weapon];
  document.getElementById('weaponName').textContent = w.name;
  document.getElementById('ammoCount').textContent =
    player.ammo === Infinity ? 'MELEE ONLY' : `AMMO: ${player.ammo}`;

  document.getElementById('crosshairMsg').classList.toggle('show', !!nearbyPickup);
}

// ---- Game State ----
function startGame() {
  initGame();
  gameState = 'playing';
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('gameOverScreen').classList.add('hidden');
  document.getElementById('hud').classList.remove('hidden');
  document.getElementById('waveInfo').classList.remove('hidden');
  document.getElementById('weaponInfo').classList.remove('hidden');
  window.focus();
  canvas.focus();
}

function gameOver() {
  gameState = 'gameover';
  const elapsed = (performance.now() - startTime) / 1000;
  const mm = Math.floor(elapsed / 60).toString().padStart(2, '0');
  const ss = Math.floor(elapsed % 60).toString().padStart(2, '0');
  document.getElementById('finalTime').textContent = `${mm}:${ss}`;
  document.getElementById('finalWave').textContent = wave;
  document.getElementById('finalKills').textContent = killCount;
  document.getElementById('gameOverScreen').classList.remove('hidden');
  document.getElementById('hud').classList.add('hidden');
  document.getElementById('waveInfo').classList.add('hidden');
  document.getElementById('weaponInfo').classList.add('hidden');
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('restartBtn').addEventListener('click', startGame);

// ---- Game Loop ----
let lastFrame = performance.now();
function loop(now) {
  const dt = now - lastFrame;
  lastFrame = now;
  try {
    update(dt);
    draw();
  } catch (err) {
    console.error('Game loop error:', err);
    showError(err.message + '\n' + (err.stack || ''));
    return; // stop loop on fatal error
  }
  requestAnimationFrame(loop);
}

function showError(msg) {
  let errDiv = document.getElementById('errorDisplay');
  if (!errDiv) {
    errDiv = document.createElement('div');
    errDiv.id = 'errorDisplay';
    errDiv.style.cssText = 'position:absolute;top:10px;left:50%;transform:translateX(-50%);background:#ff0000;color:#fff;padding:16px;font-family:monospace;font-size:12px;max-width:80%;white-space:pre-wrap;z-index:1000;border:2px solid #000;';
    document.body.appendChild(errDiv);
  }
  errDiv.textContent = 'ERROR: ' + msg;
}

window.addEventListener('error', e => {
  showError(e.message + ' @ ' + e.filename + ':' + e.lineno);
});

requestAnimationFrame(loop);
</script>
